<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeadPredictor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="panel controls">
      <div class="brand">
        <span class="brand-mark">LP</span>
        <h1>LeadPredictor</h1>
      </div>

      <label>
        <span>Language</span>
        <select>
          <option>English</option>
          <option>Bulgarian</option>
        </select>
      </label>

      <label>
        <span>Currency</span>
        <select>
          <option>$ US Dollar</option>
          <option>Euro</option>
          <option>BGN Lev</option>
        </select>
      </label>

      <label>
        <span>Campaign Start</span>
        <input id="startDate" type="date" value="2026-05-08">
      </label>

      <label>
        <span>Campaign End</span>
        <input id="endDate" type="date" value="2026-11-04">
      </label>

      <label>
        <span>Total Revenue</span>
        <input id="revenue" type="number" value="10000">
      </label>

      <label>
        <span>Avg. Order Value</span>
        <input id="orderValue" type="number" value="1000">
      </label>
    </aside>

    <section class="dashboard">
      <section class="panel chart-panel">
        <svg id="chart" viewBox="0 0 760 430"></svg>

        <div class="stats">
          <article class="stat-card">
            <div class="stat-head"><strong>Prospects</strong><b>100%</b></div>
            <output id="prospects">125</output>
            <div class="meter"><span id="prospectsMeter"></span></div>
          </article>

          <article class="stat-card">
            <div class="stat-head"><strong>Leads</strong><b id="leadRateLabel">20%</b></div>
            <output id="leads">25</output>
            <div class="meter"><span id="leadsMeter"></span></div>
          </article>

          <article class="stat-card">
            <div class="stat-head"><strong>Customers</strong><b id="customerRateLabel">8%</b></div>
            <output id="customers">10</output>
            <div class="meter"><span id="customersMeter"></span></div>
          </article>
        </div>
      </section>

      <section class="panel sliders">
        <label>
          <span>Lead Response Rate</span>
          <input id="leadRate" type="range" min="1" max="100" value="40">
          <output id="leadRateValue">40.00%</output>
        </label>

        <label>
          <span>Prospect Response Rate</span>
          <input id="prospectRate" type="range" min="1" max="100" value="20">
          <output id="prospectRateValue">20.00%</output>
        </label>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
